<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 396" width="860" height="396" role="img" aria-label="pgproof backing up a database, verifying it restores, and catching a corrupted artifact">
  <title>pgproof: backup, verify, and a caught corruption</title>
  <defs>
    <style>
      .bg   { fill: #0d1117; }
      .bar  { fill: #161b22; }
      .t    { font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
      .dim  { fill: #7d8590; }
      .fg   { fill: #e6edf3; }
      .cy   { fill: #79c0ff; }
      .gr   { fill: #3fb950; }
      .rd   { fill: #f85149; }
      .yl   { fill: #d29922; }
    </style>
  </defs>

  <rect class="bg" width="860" height="396" rx="10"/>
  <rect class="bar" width="860" height="30" rx="10"/>
  <rect class="bar" y="20" width="860" height="10"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="15" r="5" fill="#febc2e"/>
  <circle cx="56" cy="15" r="5" fill="#28c840"/>
  <text class="t dim" x="430" y="20" text-anchor="middle">pgproof</text>

  <text class="t" x="20" y="60"><tspan class="gr">$</tspan> <tspan class="fg">pgproof backup</tspan></text>
  <text class="t fg" x="20" y="82">• app: 742.5 KiB, <tspan class="gr">verified ✓</tspan> (5 tables) → [disk] in 1.821s</text>

  <text class="t" x="20" y="124"><tspan class="gr">$</tspan> <tspan class="fg">pgproof verify --db app</tspan></text>
  <text class="t gr" x="20" y="146">✓ verified: restored 5 tables into a throwaway database (312ms)</text>

  <text class="t dim" x="20" y="188"># now corrupt the stored artifact — 4 KiB of zeroes, mid-file</text>
  <text class="t" x="20" y="210"><tspan class="gr">$</tspan> <tspan class="fg">dd if=/dev/zero of=backups/app/app-…dump.age bs=1 seek=380170 count=4096 conv=notrunc</tspan></text>

  <text class="t" x="20" y="252"><tspan class="gr">$</tspan> <tspan class="fg">pgproof verify --db app</tspan></text>
  <text class="t rd" x="20" y="274">error: fetch artifact: decrypt stream: failed to decrypt and authenticate</text>
  <text class="t rd" x="20" y="294">       payload chunk</text>
  <text class="t" x="20" y="316"><tspan class="gr">$</tspan> <tspan class="fg">echo $?</tspan></text>
  <text class="t fg" x="20" y="338">1</text>

  <text class="t yl" x="20" y="372">A backup you have not restored is a hope, not a backup.</text>
</svg>
